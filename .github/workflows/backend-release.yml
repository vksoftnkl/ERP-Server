# Part B Step 4 §4.1: the backend release workflow.
#
# NEVER RENAME THIS WORKFLOW (file or name). The backend build number is
# github.run_number + vars.BACKEND_BUILD_OFFSET, and a renamed workflow starts
# run_number again at 1. If that ever happens, raise BACKEND_BUILD_OFFSET above
# the last backend-build-* tag; the "build number" step refuses anything lower.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   secrets  CI_API_URL       release registry, e.g. https://<cloud>/api/v1
#            CI_USER          the ci-release user (role RELEASE MANAGER, no menus)
#            CI_PASSWORD
#            RELEASE_SSH_HOST, RELEASE_SSH_USER, RELEASE_SSH_KEY (private key),
#            RELEASE_SSH_KNOWN_HOSTS (ssh-keyscan line of the host)
#   vars     BACKEND_BUILD_OFFSET   default 1000 (above every number used in testing)
#            RELEASE_DIR            upload folder on the release host, e.g. /var/www/releases
#
# Cloud deploy stays manual (decision E7): this workflow only builds, tests,
# packages and uploads.
name: backend-release

on:
  workflow_dispatch:
    inputs:
      web_build:
        description: 'Expected web build in compat.json (blank = latest registered)'
        required: false
        default: ''
      desktop_build:
        description: 'Expected desktop build in compat.json (blank = latest registered)'
        required: false
        default: ''
      mobile_build:
        description: 'Expected mobile build in compat.json (blank = latest registered)'
        required: false
        default: ''
      upload:
        description: 'Upload the package and tag the build (off = build + test only)'
        type: boolean
        default: true
  push:
    branches: ['release/**']

concurrency:
  group: backend-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Guard, build, test, package files
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.number.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration guard and the build-number check read tags

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build number (run_number + offset)
        id: number
        env:
          OFFSET: ${{ vars.BACKEND_BUILD_OFFSET || '1000' }}
        run: |
          build=$(( GITHUB_RUN_NUMBER + OFFSET ))
          last="$(git tag --list 'backend-build-*' | sed 's/^backend-build-//' | sort -n | tail -n 1)"
          echo "backend build: last ${last:-none} -> $build (run $GITHUB_RUN_NUMBER + offset $OFFSET)"
          if [[ -n "$last" ]] && (( build <= last )); then
            echo "::error::Backend build $build is not above the last released backend build $last. Was the workflow renamed? Raise vars.BACKEND_BUILD_OFFSET."
            exit 1
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci # postinstall builds prisma/schema.prisma and generates the client

      - name: Migration guard (schema change without a migration fails)
        run: bash ci/backend/migration-guard.sh

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

      - name: Write build-info.json, compat.json, releases.json
        env:
          BUILD: ${{ steps.number.outputs.build }}
          COMMIT: ${{ github.sha }}
          CI_API_URL: ${{ secrets.CI_API_URL }}
          CI_USER: ${{ secrets.CI_USER }}
          CI_PASSWORD: ${{ secrets.CI_PASSWORD }}
          WEB_BUILD: ${{ inputs.web_build }}
          DESKTOP_BUILD: ${{ inputs.desktop_build }}
          MOBILE_BUILD: ${{ inputs.mobile_build }}
        run: node ci/backend/write-package-files.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: backend-build-output
          path: |
            dist/
            build-info.json
            compat.json
            releases.json
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package for Windows (on-prem)
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: backend-build-output
          path: .

      - name: Production dependencies (Windows native addons + Prisma engine)
        run: npm ci --omit=dev

      - name: Pack
        id: pack
        env:
          BUILD: ${{ needs.build.outputs.build }}
          OUT_DIR: out
        run: bash ci/backend/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: |
            out/*.zip
            out/*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Upload to the release storage and tag
    needs: [build, package]
    if: github.event_name == 'push' || inputs.upload
    runs-on: ubuntu-latest
    permissions:
      contents: write # the backend-build-<n> tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: out

      - name: 'Upload (E6 - VPS static folder)'
        env:
          BUILD: ${{ needs.build.outputs.build }}
          SSH_HOST: ${{ secrets.RELEASE_SSH_HOST }}
          SSH_USER: ${{ secrets.RELEASE_SSH_USER }}
          SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RELEASE_SSH_KNOWN_HOSTS }}
          RELEASE_DIR: ${{ vars.RELEASE_DIR }}
        run: |
          for v in SSH_HOST SSH_USER SSH_KEY SSH_KNOWN_HOSTS RELEASE_DIR; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not configured"; exit 1; }
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/release_key && chmod 600 ~/.ssh/release_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          target="$RELEASE_DIR/backend/$BUILD"
          ssh -i ~/.ssh/release_key "$SSH_USER@$SSH_HOST" "mkdir -p '$target'"
          scp -i ~/.ssh/release_key out/*.zip out/*.zip.sha256 "$SSH_USER@$SSH_HOST:$target/"
          ssh -i ~/.ssh/release_key "$SSH_USER@$SSH_HOST" "cd '$target' && sha256sum -c *.sha256"
          rm -f ~/.ssh/release_key

      - name: Tag backend-build-${{ needs.build.outputs.build }}
        env:
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          git tag "backend-build-$BUILD" "$GITHUB_SHA"
          git push origin "backend-build-$BUILD"
