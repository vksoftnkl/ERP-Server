version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_app
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp_app -d erp_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
