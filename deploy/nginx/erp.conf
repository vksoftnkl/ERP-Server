# ERP API reverse proxy.
# The Node process binds 127.0.0.1:3000 only; nginx is its sole client and
# terminates TLS. Keep HTTPS_ENABLED=false in .env so the app speaks plain HTTP.
#
# Two TLS server blocks on purpose:
#   169-58-213-171.sslip.io -> real Let's Encrypt cert (what browsers/frontends use)
#   default (bare IP)       -> self-signed, so https://169.58.213.171 still answers
#                              for curl -k and Postman instead of failing to connect.

upstream erp_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Must stay reachable over plain HTTP: certbot renews via this path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Real certificate: the hostname the frontend should call ----------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 169-58-213-171.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/169-58-213-171.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/169-58-213-171.sslip.io/privkey.pem;

    include /etc/nginx/snippets/erp-proxy.conf;
}

# ---- Self-signed fallback for the bare IP ----------------------------------
server {
    # nginx 1.24 (Ubuntu 24.04) predates the standalone `http2 on;` directive,
    # which arrived in 1.25.1 -- enable it on the listener instead.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/erp-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/erp-selfsigned.key;

    include /etc/nginx/snippets/erp-proxy.conf;
}
