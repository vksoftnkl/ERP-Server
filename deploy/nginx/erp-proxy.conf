# Shared proxy + TLS settings, included by every ERP server block so the
# real-cert and self-signed vhosts cannot drift apart.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;

# REQUEST_BODY_LIMIT is 10mb in .env; leave nginx a margin so the app -- not
# nginx -- rejects an oversized body, with a JSON error rather than HTML.
client_max_body_size 20m;

# Report/grid endpoints over a large dataset can legitimately run long.
proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

access_log /var/log/nginx/erp-access.log;
error_log  /var/log/nginx/erp-error.log;

location / {
    proxy_pass http://erp_api;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # The app sits behind TLS termination; without this it would build absolute
    # URLs (Swagger, redirects) as http://.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streamed responses should not be buffered into a temp file first.
    proxy_buffering off;
}
