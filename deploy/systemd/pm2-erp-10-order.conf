# Drop-in for the unit `pm2 startup systemd` generates.
# Install at /etc/systemd/system/pm2-erp.service.d/10-order.conf, then
# `systemctl daemon-reload`.
[Unit]
# Without this, PM2 can start before Postgres/Redis accept connections. The app
# would survive it -- bootstrap exits non-zero and PM2 backs off and retries --
# but it turns every reboot into a noisy minute of crash-restarts.
After=postgresql.service redis-server.service
Wants=postgresql.service redis-server.service
