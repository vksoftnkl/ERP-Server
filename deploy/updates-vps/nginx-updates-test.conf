# Release pipeline §3.4: serve /var/www/updates/test/ at https://<vps>/updates/test/
#
# Installed by install-nginx-updates-test.sh as /etc/nginx/snippets/vknex-updates-test.conf and
# included in the 443 server block. By hand: put this block INSIDE the `server { listen 443 ssl ...; }` block that serves
# the VPS name (deploy/nginx/erp.conf, the sslip.io server), ABOVE `location / { ... }`.
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# Access: basic auth (below). Make the password file once:
#   printf 'vknex-test:%s\n' "$(openssl passwd -apr1)" | sudo tee /etc/nginx/vknex-updates-test.htpasswd >/dev/null
#   sudo chown root:www-data /etc/nginx/vknex-updates-test.htpasswd && sudo chmod 640 /etc/nginx/vknex-updates-test.htpasswd
# Or an IP allow-list instead: replace the two auth_basic lines with
#   allow <office IP>; deny all;

# ^~ : a server-level regex location (now or later) can never take these requests.
location ^~ /updates/test/ {
    root /var/www;               # /updates/test/x -> /var/www/updates/test/x
    autoindex off;

    auth_basic           "VK Nex updates (test)";
    auth_basic_user_file /etc/nginx/vknex-updates-test.htpasswd;

    # Never serve half or temporary files, or the gate's lock file.
    location ~ (\.part|\.tmp)$ { return 404; }
    location ~ /\.             { return 404; }

    # The feed: always revalidated, so an updater sees a new build at once.
    location ~ \.json$ {
        add_header Cache-Control "no-cache" always;
    }

    # A released zip never changes (the gate refuses to replace one).
    location ~ \.zip(\.sha256)?$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
